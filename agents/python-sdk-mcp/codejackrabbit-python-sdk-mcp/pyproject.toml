[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codejackrabbit-python-sdk-mcp"
version = "0.3.4"
requires-python = ">=3.9"
description = "MCP operation tools backed by a bundled generated Python SDK"
readme = "README.md"
dependencies = ["httpx>=0.24,<1", "typing_extensions>=4.2.0", "jsonschema>=4.18,<5"]

[project.scripts]
"codejackrabbit-python-sdk-mcp" = "omniwrap_codejackrabbit_mcp.server:main"

[tool.setuptools]
packages = ["omniwrap_codejackrabbit_mcp", "omniwrap_mcp_b06781a26c44_sdk", "omniwrap_mcp_b06781a26c44_sdk.resources"]

[tool.setuptools.package-dir]
"omniwrap_codejackrabbit_mcp" = "omniwrap_codejackrabbit_mcp"
"omniwrap_mcp_b06781a26c44_sdk" = "_sdk/omniwrap-mcp-b06781a26c44-sdk/omniwrap_mcp_b06781a26c44_sdk"

[tool.setuptools.package-data]
"omniwrap_codejackrabbit_mcp" = ["tool-map.json", "semantic-api.json", "docs-index.json"]
"omniwrap_mcp_b06781a26c44_sdk" = ["py.typed"]
